<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 280" width="320" height="280">
  <rect width="320" height="280" fill="#0B0F1A"/>
  <!-- Supply plenum (left) -->
  <rect x="20" y="85" width="70" height="50" rx="3" fill="#27354F" stroke="#3B82F6" stroke-width="2"/>
  <text x="55" y="114" text-anchor="middle" fill="#F8FAFC" font-family="Inter, sans-serif" font-size="10" font-weight="600">SUPPLY</text>
  <!-- Cabinet -->
  <rect x="95" y="70" width="150" height="140" rx="4" fill="#1E293B" stroke="#334155" stroke-width="2"/>
  <!-- Furnace label -->
  <text x="170" y="100" text-anchor="middle" fill="#94A3B8" font-family="Inter, sans-serif" font-size="10" font-weight="600">FURNACE</text>
  <!-- Heat exchanger coils -->
  <path d="M120,115 Q140,105 160,115" fill="none" stroke="#F59E0B" stroke-width="1.5" opacity="0.6"/>
  <path d="M120,125 Q140,115 160,125" fill="none" stroke="#F59E0B" stroke-width="1.5" opacity="0.6"/>
  <path d="M120,135 Q140,125 160,135" fill="none" stroke="#F59E0B" stroke-width="1.5" opacity="0.6"/>
  <!-- Flame -->
  <path d="M165,145 Q170,135 175,145 Q170,152 165,145" fill="#F59E0B" opacity="0.7"/>
  <!-- Return plenum (right) -->
  <rect x="250" y="85" width="60" height="50" rx="3" fill="#27354F" stroke="#06B6D4" stroke-width="2"/>
  <text x="280" y="114" text-anchor="middle" fill="#F8FAFC" font-family="Inter, sans-serif" font-size="10" font-weight="600">RETURN</text>
  <!-- Blue arrows pointing LEFT (supply) -->
  <line x1="10" y1="100" x2="2" y2="100" stroke="#3B82F6" stroke-width="2" stroke-linecap="round"/>
  <polygon points="-2,100 6,104 6,96" fill="#3B82F6"/>
  <line x1="10" y1="120" x2="2" y2="120" stroke="#3B82F6" stroke-width="2" stroke-linecap="round"/>
  <polygon points="-2,120 6,124 6,116" fill="#3B82F6"/>
  <!-- Cyan arrows pointing IN from right (return) -->
  <line x1="310" y1="100" x2="318" y2="100" stroke="#06B6D4" stroke-width="2" stroke-linecap="round"/>
  <polygon points="322,100 314,104 314,96" fill="#06B6D4"/>
  <line x1="310" y1="120" x2="318" y2="120" stroke="#06B6D4" stroke-width="2" stroke-linecap="round"/>
  <polygon points="322,120 314,124 314,116" fill="#06B6D4"/>
  <!-- Label -->
  <text x="160" y="260" text-anchor="middle" fill="#94A3B8" font-family="Inter, sans-serif" font-size="10">Horizontal</text>
</svg>