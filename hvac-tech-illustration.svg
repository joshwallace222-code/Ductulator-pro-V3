<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <rect width="400" height="300" fill="#0B0F1A"/>
  <!-- Floor -->
  <rect x="0" y="250" width="400" height="50" fill="#1E293B"/>
  <!-- HVAC Unit -->
  <rect x="40" y="140" width="100" height="110" rx="4" fill="#27354F" stroke="#334155" stroke-width="2"/>
  <rect x="50" y="150" width="80" height="70" rx="2" fill="#1E293B"/>
  <!-- Coil fins -->
  <line x1="55" y1="155" x2="125" y2="155" stroke="#334155" stroke-width="1"/>
  <line x1="55" y1="165" x2="125" y2="165" stroke="#334155" stroke-width="1"/>
  <line x1="55" y1="175" x2="125" y2="175" stroke="#334155" stroke-width="1"/>
  <line x1="55" y1="185" x2="125" y2="185" stroke="#334155" stroke-width="1"/>
  <line x1="55" y1="195" x2="125" y2="195" stroke="#334155" stroke-width="1"/>
  <!-- Duct connections -->
  <rect x="130" y="155" width="30" height="20" fill="none" stroke="#3B82F6" stroke-width="2"/>
  <rect x="130" y="205" width="30" height="20" fill="none" stroke="#3B82F6" stroke-width="2"/>
  <!-- Fan symbol -->
  <circle cx="90" cy="230" r="8" fill="none" stroke="#3B82F6" stroke-width="1.5"/>
  <line x1="90" y1="230" x2="95" y2="225" stroke="#3B82F6" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Technician -->
  <!-- Body -->
  <rect x="240" y="140" width="50" height="80" rx="8" fill="#27354F" stroke="#334155" stroke-width="2"/>
  <!-- Head -->
  <circle cx="265" cy="115" r="20" fill="#27354F" stroke="#334155" stroke-width="2"/>
  <!-- Hair -->
  <path d="M250,105 Q265,90 280,105" fill="none" stroke="#3B82F6" stroke-width="2" stroke-linecap="round"/>
  <!-- Eyes -->
  <circle cx="258" cy="115" r="2" fill="#94A3B8"/>
  <circle cx="272" cy="115" r="2" fill="#94A3B8"/>
  <!-- Smile -->
  <path d="M258,125 Q265,130 272,125" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Tablet -->
  <rect x="215" y="155" width="40" height="50" rx="3" fill="#1E293B" stroke="#3B82F6" stroke-width="2"/>
  <rect x="220" y="162" width="30" height="30" rx="1" fill="#0B0F1A"/>
  <!-- Chart lines on tablet -->
  <line x1="223" y1="170" x2="247" y2="170" stroke="#3B82F6" stroke-width="1" opacity="0.5"/>
  <line x1="223" y1="178" x2="240" y2="178" stroke="#22C55E" stroke-width="1" opacity="0.5"/>
  <line x1="223" y1="186" x2="242" y2="186" stroke="#F59E0B" stroke-width="1" opacity="0.5"/>
  <!-- Arms -->
  <rect x="220" y="145" width="25" height="10" rx="5" fill="#334155"/>
  <!-- Legs -->
  <rect x="248" y="220" width="14" height="30" rx="3" fill="#334155"/>
  <rect x="268" y="220" width="14" height="30" rx="3" fill="#334155"/>
