<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 320" width="280" height="320">
  <rect width="280" height="320" fill="#0B0F1A"/>
  <!-- Return plenum (top) -->
  <rect x="85" y="40" width="110" height="55" rx="3" fill="#27354F" stroke="#06B6D4" stroke-width="2"/>
  <text x="140" y="73" text-anchor="middle" fill="#F8FAFC" font-family="Inter, sans-serif" font-size="11" font-weight="600">RETURN</text>
  <!-- Cabinet -->
  <rect x="70" y="100" width="140" height="140" rx="4" fill="#1E293B" stroke="#334155" stroke-width="2"/>
  <!-- Furnace label -->
  <text x="140" y="135" text-anchor="middle" fill="#94A3B8" font-family="Inter, sans-serif" font-size="10" font-weight="600">FURNACE</text>
  <!-- Heat exchanger symbol -->
  <path d="M90,150 Q110,140 130,150 T170,150" fill="none" stroke="#F59E0B" stroke-width="2" opacity="0.7"/>
  <path d="M90,165 Q110,155 130,165 T170,165" fill="none" stroke="#F59E0B" stroke-width="2" opacity="0.7"/>
  <path d="M90,180 Q110,170 130,180 T170,180" fill="none" stroke="#F59E0B" stroke-width="2" opacity="0.7"/>
  <!-- Flame icon -->
  <path d="M135,195 Q140,180 145,195 Q140,205 135,195" fill="#F59E0B" opacity="0.8"/>
  <path d="M138,198 Q140,190 142,198" fill="#EF4444" opacity="0.6"/>
  <!-- Supply plenum (bottom) -->
  <rect x="85" y="245" width="110" height="55" rx="3" fill="#27354F" stroke="#3B82F6" stroke-width="2"/>
  <text x="140" y="278" text-anchor="middle" fill="#F8FAFC" font-family="Inter, sans-serif" font-size="11" font-weight="600">SUPPLY</text>
  <!-- Cyan arrows pointing IN (return from top) -->
  <line x1="115" y1="20" x2="115" y2="8" stroke="#06B6D4" stroke-width="2" stroke-linecap="round"/>
  <polygon points="115,2 119,10 111,10" fill="#06B6D4"/>
  <line x1="140" y1="20" x2="140" y2="8" stroke="#06B6D4" stroke-width="2" stroke-linecap="round"/>
  <polygon points="140,2 144,10 136,10" fill="#06B6D4"/>
  <line x1="165" y1="20" x2="165" y2="8" stroke="#06B6D4" stroke-width="2" stroke-linecap="round"/>
  <polygon points="165,2 169,10 161,10" fill="#06B6D4"/>
  <!-- Blue arrows pointing DOWN (supply) -->
  <line x1="115" y1="300" x2="115" y2="312" stroke="#3B82F6" stroke-width="2" stroke-linecap="round"/>
  <polygon points="115,318 119,310 111,310" fill="#3B82F6"/>
  <line x1="140" y1="300" x2="140" y2="312" stroke="#3B82F6" stroke-width="2" stroke-linecap="round"/>
  <polygon points="140,318 144,310 136,310" fill="#3B82F6"/>
  <line x1="165" y1="300" x2="165" y2="312" stroke="#3B82F6" stroke-width="2" stroke-linecap="round"/>
  <polygon points="165,318 169,310 161,310" fill="#3B82F6"/>
  <!-- Label -->
  <text x="140" y="305" text-anchor="middle" fill="#94A3B8" font-family="Inter, sans-serif" font-size="10">Downflow</text>
</svg>