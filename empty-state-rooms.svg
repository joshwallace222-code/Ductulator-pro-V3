<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" fill="#0B0F1A"/>
  <!-- Room outline -->
  <rect x="50" y="50" width="100" height="100" rx="4" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="6 4"/>
  <!-- Door gap -->
  <line x1="100" y1="150" x2="120" y2="150" stroke="#0B0F1A" stroke-width="4"/>
  <!-- Plus sign in center -->
  <circle cx="100" cy="100" r="24" fill="#1E293B" stroke="#3B82F6" stroke-width="1.5"/>
  <line x1="100" y1="88" x2="100" y2="112" stroke="#3B82F6" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="88" y1="100" x2="112" y2="100" stroke="#3B82F6" stroke-width="2.5" stroke-linecap="round"/>
</svg>